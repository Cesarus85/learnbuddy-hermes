deployment:
  mode: vps
  host_hint: ubuntu-24.04

family:
  language: de
  timezone: Europe/Berlin

child:
  id: emma
  display_name: Emma

agent:
  name: Lumi

safety:
  max_attempts: 3
  queue_max: 5
  daily_auto_limit: 1

storage:
  data_dir: "${HERMES_HOME}/family/learnbuddy"

llm:
  mode: cloud
  provider: openrouter
  api_key_env: OPENROUTER_API_KEY

security:
  require_firewall: true
  require_https: true
  no_telemetry: true
